<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ラウンジ即時集計オーバーレイ</title>
  <style>
    :root {
      --root-background : rgba(0, 0, 0, 0);
      --t2-header-height: 50px;
      --t2-body-height  : 80px;
      --t2-team-height  : 85px;
      --t2-space-width  : 100px;
      --t2-team-width   : 150px;
      --t2-score-width  : 130px;
      --t2-all-width    : calc(var(--t2-space-width) + (var(--t2-team-width) * 2) + (var(--t2-score-width) * 2));
      --t2-dif-width    : calc(var(--t2-team-width) + var(--t2-score-width));
      --t2-header-font  : 35px;
      --t2-score-font   : 60px;
      --t2-team-font    : 50px;
      --t2-plus-color   : orangered;
      --t2-minus-color  : deepskyblue;
      --t2-race-color   : gold;
      --t2-win-font     : 35px;
      --t2-win-background: yellow;
      --t2-win-color     : orangered;
      --t6-team-font      : 35px;
      --t6-dif-font       : 25px;
      --t6-race-font      : 25px;
      --t6-team-width     : calc(780px / 6);
      --t6-dif-space-width: calc(var(--t6-team-width) / 2);
      --t6-team-height    : 45px;
      --t6-dif-height     : 35px;
      --t6-border-left    : 1px solid #666666;
      --t6-border-top     : 1px solid #666666;
    }
    body, div, p {
      display: block;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      border: none;
      border-radius: 0;
      overflow: hidden;
      white-space: nowrap;
      text-align: center;
    }
    p {
      display: inline-block;
      height: 100%;
    }
    body {
      background: var(--root-background);
      background-size: cover;
    }
    .team-span {
      display: inline-block;
      transform-origin: left top;
    }
    .overlay-container {
      width: 800px;
      height: 160px;
      display: none;
      justify-content: center;
      flex-direction: column;
      align-items: center;
      flex-wrap: wrap;
      font-weight: bold;
      font-family: sans-serif;
    }
      .overlay-container.respect-kusaan .overlay-inner {
        background: rgba(0, 0, 0, 0.6);
        color: #ffffff;
        position: relative;
        font-size: 0;
        padding: 15px 10px;
        border-radius: 10px;
      }
        .overlay-container.respect-kusaan.team-num-2 .header {
          width: var(--t2-all-width);
          height: var(--t2-header-height);
          position: relative;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding-left: calc(var(--t2-team-width) + 6px);
          padding-right: 15px;
          gap: 8px;
        }
          .overlay-container.respect-kusaan.team-num-2 .header p {
            line-height: var(--t2-header-height);
            font-size: var(--t2-header-font);
            height: var(--t2-header-height);
            display: flex;
            align-items: center;
          }
          .overlay-container.respect-kusaan.team-num-2 .header .score-dif {
            flex: 0 0 auto;
            width: auto;
            text-align: left;
            order: 1;
          }
          .overlay-container.respect-kusaan.team-num-2 .header .score-dif.plus {
            color: var(--t2-plus-color);
          }
          .overlay-container.respect-kusaan.team-num-2 .header .score-dif.minus {
            color: var(--t2-minus-color);
          }
          .overlay-container.respect-kusaan.team-num-2 .header .left-race {
            color: var(--t2-race-color);
            flex: 0 0 auto;
            width: auto;
            text-align: right;
            order: 2;
            margin-left: auto;
          }
        .overlay-container.respect-kusaan.team-num-2 .body {
          height: var(--t2-body-height);
        }
          .overlay-container.respect-kusaan.team-num-2 .body p {
            line-height: var(--t2-body-height);
            font-size: var(--t2-score-font);
          }
          .overlay-container.respect-kusaan.team-num-2 .body .team {
            width: var(--t2-team-width);
            font-size: var(--t2-team-font);
            line-height: var(--t2-team-height);
          }
          .overlay-container.respect-kusaan.team-num-2 .body .score {
            width: var(--t2-score-width);
          }
          .overlay-container.respect-kusaan.team-num-2 .body .score-1 {
            text-align: right;
          }
          .overlay-container.respect-kusaan.team-num-2 .body .score-2 {
            text-align: left;
          }
          .overlay-container.respect-kusaan.team-num-2 .body .split {
            width: var(--t2-space-width);
          }
        .overlay-container.respect-kusaan.team-num-2 .win {
          position: absolute;
          left: 0;
          top: 0;
          font-size: var(--t2-win-font);
          width: var(--t2-team-width);
          height: var(--t2-header-height);
          line-height: var(--t2-header-height);
          background: var(--t2-win-background);
          color: var(--t2-win-color);
        }
        .overlay-container.respect-kusaan.team-num-6 p {
          width: var(--t6-team-width);
          font-size: var(--t6-team-font);
        }
        .overlay-container.respect-kusaan.team-num-6 .teams {
          height: var(--t6-team-height);
        }
        .overlay-container.respect-kusaan.team-num-6 .scores {
          height: var(--t6-team-height);
          border-top: var(--t6-border-top);
        }
          .overlay-container.respect-kusaan.team-num-6 .teams p:first-child,
          .overlay-container.respect-kusaan.team-num-6 .scores p:first-child {
            border: none;
          }
          .overlay-container.respect-kusaan.team-num-6 .teams p,
          .overlay-container.respect-kusaan.team-num-6 .scores p {
            line-height: var(--t6-team-height);
            border-left: var(--t6-border-left);
          }
        .overlay-container.respect-kusaan.team-num-6 .difs {
          height: var(--t6-dif-height);
        }
          .overlay-container.respect-kusaan.team-num-6 .difs p {
            line-height: var(--t6-dif-height);
            font-size: var(--t6-dif-font);
          }
          .overlay-container.respect-kusaan.team-num-6 .difs .space {
            width: var(--t6-dif-space-width);
          }
        .overlay-container.respect-kusaan.team-num-6 .left-race {
          position: absolute;
          right: 0;
          bottom: 0;
          height: var(--t6-dif-height);
          line-height: var(--t6-dif-height);
          color: var(--t2-race-color);
          font-size: var(--t6-race-font);
          margin-right: 10px;
        }
  </style>
</head>
<body>
  <div id="team-num-2" class="overlay-container respect-kusaan team-num-2" style="display: none;">
    <div class="overlay-inner">
      <div class="header">
        <p class="score-dif plus">+0</p>
        <p class="left-race">残レース:12</p>
      </div>
      <div class="body">
        <p class="team team-1"><span class="team-span">A</span></p>
        <p class="score score-1">0</p>
        <p class="split">-</p>
        <p class="score score-2">0</p>
        <p class="team team-2"><span class="team-span">B</span></p>
      </div>
      <div class="win" style="display: none;">win!</div>
    </div>
  </div>
  <div id="team-num-3" class="overlay-container respect-kusaan team-num-6"><div class="overlay-inner"><div class="teams"><p class="team team-1"><span class="team-span">AAA</span></p><p class="team team-2"><span class="team-span">BBB</span></p><p class="team team-3"><span class="team-span">CCC</span></p></div><div class="scores"><p class="score score-1">0</p><p class="score score-2">0</p><p class="score score-3">0</p></div><div class="difs"><p class="space"></p><p class="dif dif-1">+0</p><p class="dif dif-2">+0</p></div><div class="left-race">残12</div></div></div>
  <div id="team-num-4" class="overlay-container respect-kusaan team-num-6"><div class="overlay-inner"><div class="teams"><p class="team team-1"><span class="team-span">AAA</span></p><p class="team team-2"><span class="team-span">BBB</span></p><p class="team team-3"><span class="team-span">CCC</span></p><p class="team team-4"><span class="team-span">DDD</span></p></div><div class="scores"><p class="score score-1">0</p><p class="score score-2">0</p><p class="score score-3">0</p><p class="score score-4">0</p></div><div class="difs"><p class="space"></p><p class="dif dif-1">+0</p><p class="dif dif-2">+0</p><p class="dif dif-3">+0</p></div><div class="left-race">残12</div></div></div>
  <div id="team-num-6" class="overlay-container respect-kusaan team-num-6"><div class="overlay-inner"><div class="teams"><p class="team team-1"><span class="team-span">AAA</span></p><p class="team team-2"><span class="team-span">BBB</span></p><p class="team team-3"><span class="team-span">CCC</span></p><p class="team team-4"><span class="team-span">DDD</span></p><p class="team team-5"><span class="team-span">EEE</span></p><p class="team team-6"><span class="team-span">FFF</span></p></div><div class="scores"><p class="score score-1">0</p><p class="score score-2">0</p><p class="score score-3">0</p><p class="score score-4">0</p><p class="score score-5">0</p><p class="score score-6">0</p></div><div class="difs"><p class="space"></p><p class="dif dif-1">+0</p><p class="dif dif-2">+0</p><p class="dif dif-3">+0</p><p class="dif dif-4">+0</p><p class="dif dif-5">+0</p></div><div class="left-race">残12</div></div></div>

  <script>
    const params = new URLSearchParams(location.search);
    const apiBase = (
      params.get('api') || 'https://140-245-94-102.sslip.io'
    ).replace(/\/+$/, '');
    const userId = (params.get('user') || params.get('id') || '').trim();
    const loungeEndpoint = userId
      ? `${apiBase}/api/v1/lounge/user/${encodeURIComponent(userId)}`
      : `${apiBase}/api/v1/lounge/current`;

    function hideOverlay() {
      document.querySelectorAll('.overlay-container').forEach((el) => {
        el.style.display = 'none';
      });
    }

    function isLoungeActive(raw) {
      if (!raw || !Array.isArray(raw.teams)) return false;
      if (typeof raw.active === 'boolean' && !raw.active) return false;
      const now = Date.now();
      let hasValidUntil = false;
      if (raw.active_until) {
        const until = Date.parse(raw.active_until);
        if (!Number.isNaN(until)) {
          if (now > until) return false;
          hasValidUntil = true;
        }
      }
      const updatedMs = raw.updated_at ? Date.parse(raw.updated_at) : NaN;
      const raceCount = Number(
        raw.race_count ?? (Array.isArray(raw.races) ? raw.races.length : 0)
      );
      const totalRaces = Number(raw.total_races ?? 12);
      const left = raw.left != null ? Number(raw.left) : Math.max(0, totalRaces - raceCount);
      if (!Number.isNaN(updatedMs)) {
        if (!hasValidUntil && left <= 0 && now - updatedMs > 180 * 1000) return false;
        if (now - updatedMs > 2 * 60 * 60 * 1000) return false;
      }
      if (typeof raw.active !== 'boolean') {
        if (raceCount === 0 && left === totalRaces) return false;
      }
      return true;
    }

    function updateTeamSpans() {
      document.querySelectorAll('.team-span').forEach(($span) => {
        $span.style.transform = '';
        const $parent = $span.parentNode;
        if (!$parent || !$parent.offsetWidth) return;
        let scaleX = 1;
        let translateX = 0;
        if ($span.offsetWidth > $parent.offsetWidth - 20) {
          scaleX = ($parent.offsetWidth - 20) / $span.offsetWidth;
          translateX = 10;
        }
        $span.style.setProperty(
          'transform',
          `translateX(${translateX}px) scaleX(${scaleX})`
        );
      });
    }

    function normalizeLoungePayload(raw) {
      if (!raw || !Array.isArray(raw.teams)) return null;
      const teams = raw.teams.map((t) => String(t).trim()).filter(Boolean);
      const totals = raw.totals || {};
      const entries = teams.map((tag, idx) => ({
        tag,
        score: Number(totals[tag] ?? 0),
        idx,
      }));
      const totalRaces = Number(raw.total_races ?? 12);
      const raceCount = Number(
        raw.race_count ?? (Array.isArray(raw.races) ? raw.races.length : 0)
      );
      const left =
        raw.left != null ? Number(raw.left) : Math.max(0, totalRaces - raceCount);

      if (entries.length === 2) {
        const s0 = entries[0].score;
        const s1 = entries[1].score;
        const delta = s0 - s1;
        return {
          teams: [entries[0].tag, entries[1].tag],
          scores: [s0, s1],
          dif: delta > 0 ? `+${delta}` : delta < 0 ? `${delta}` : '±0',
          win: left === 0 ? (s0 > s1 ? 1 : s1 > s0 ? 2 : 0) : 0,
          left,
        };
      }
      entries.sort((a, b) => (b.score - a.score) || (a.idx - b.idx));
      return {
        teams: entries.map((e) => e.tag),
        scores: entries.map((e) => e.score),
        left,
      };
    }

    function reflectLounge(raw) {
      if (!isLoungeActive(raw)) {
        hideOverlay();
        return;
      }
      const data = normalizeLoungePayload(raw);
      if (!data || !data.teams) {
        hideOverlay();
        return;
      }
      const teams = data.teams;
      const scores = data.scores || [0, 0];
      const left = data.left ?? 12;
      const teamNum = teams.length;

      const targetId = `team-num-${teamNum}`;
      const container = document.getElementById(targetId);
      if (!container) {
        hideOverlay();
        return;
      }

      document.querySelectorAll('.overlay-container').forEach((el) => {
        el.style.display = el.id === targetId ? 'flex' : 'none';
      });

      if (teamNum === 2) {
        const dif = data.dif || '±0';
        const win = Number(data.win || 0);
        container.querySelectorAll('.score').forEach(($score, i) => {
          $score.innerText = scores[i] ?? 0;
        });
        container.querySelectorAll('.team-span').forEach(($team, i) => {
          $team.innerText = teams[i] ?? '';
        });
        container.querySelectorAll('.score-dif').forEach(($dif) => {
          $dif.classList.remove('plus', 'minus');
          $dif.classList.add(dif.startsWith('-') ? 'minus' : 'plus');
          $dif.innerText = dif;
        });
        container.querySelectorAll('.left-race').forEach(($race) => {
          $race.innerText = `残レース:${left}`;
        });
        container.querySelectorAll('.win').forEach(($win) => {
          $win.style.setProperty('display', win === 1 ? 'block' : 'none');
        });
      } else {
        container.querySelectorAll('.score').forEach(($score, i) => {
          $score.innerText = scores[i] ?? 0;
        });
        container.querySelectorAll('.team-span').forEach(($team, i) => {
          $team.innerText = teams[i] ?? '';
        });
        container.querySelectorAll('.dif').forEach(($dif, i) => {
          const s1 = scores[i] ?? 0;
          const s2 = scores[i + 1] ?? 0;
          $dif.innerText = `+${s1 - s2}`;
        });
        container.querySelectorAll('.left-race').forEach(($race) => {
          $race.innerText = `残${left}`;
        });
      }

      updateTeamSpans();
    }

    async function loadLounge() {
      try {
        const res = await fetch(loungeEndpoint, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        reflectLounge(await res.json());
      } catch (err) {
        hideOverlay();
      }
    }

    loadLounge();
    setInterval(loadLounge, 2000);
  </script>
</body>
</html>
